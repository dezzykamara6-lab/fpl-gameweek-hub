<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPL Gameweek Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b1120;
            color: #e2e8f0;
            line-height: 1.5;
        }

        header {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid #22c55e;
        }

        header h1 {
            font-size: 28px;
            color: #22c55e;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 15px;
        }

        .badge {
            display: inline-block;
            background: #1e293b;
            color: #22c55e;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 12px;
            border: 1px solid #334155;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 18px;
            border: 1px solid #334155;
        }

        .card h2 {
            color: #22c55e;
            font-size: 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hero {
            text-align: center;
            padding: 30px 20px;
        }

        .hero .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #94a3b8;
            font-size: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #94a3b8;
            margin: 14px 0 6px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #22c55e;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #22c55e;
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            margin-top: 16px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }
